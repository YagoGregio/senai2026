<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sytle.css">
    <title>Tela de Login</title>
</head>
<body>
    <center>
        <form id="formulario">
            <h1>Tela de Login</h1>

            <label>Usuario:</label>

        <p id="resultado"></p>
    </center>
    <script src="script.js"></script>
