<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="style.css"
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML+CSS+JS</title>
</head>
<body>
    <script src="script.js"></script>
    <header>
        <h1>Exercício Calculadora</h1>

        <p>Fazendo uma calculadora com as operções básicas da matemática</p>
        <!-- Calculando a Soma -->
    </header>
    <section>
        <h1>Calculadora de Soma</h1>

            <label for="numero1">Primeiro número:</label>

            <input type="number" id="numero1">

            <br><br>

            <label for="numero2">Segundo número:</label>

            <input type="number" id="numero2">

            <br><br>

            <button onclick="somar()">
                Somar
            </button>

            <p id="resultado"></p>
    </section>
    <!-- Calculando a Subtração-->
    <section>
        <h1>Caludora de Subtração</h1>

         <label for="numero1">Primeiro número:</label>

            <input type="number" id="sub1">

            <br><br>

            <label for="numero2">Segundo número:</label>

            <input type="number" id="sub2">

            <br><br>

            <button onclick="subtrair()">
                Subtrair
            </button>

            <p id="resultadosub"></p>
    </section>
    <!-- Calculando a Multiplicação-->
    <section>
        <h1>Calculadora de Multiplicação</h1>

            <label for="mult1">Primeiro número:</label>

            <input type="number" id="mult1">

            <br><br>

            <label for="mult2">Segundo número:</label>

            <input type="number" id="mult2">

            <br><br>

            <button onclick="multiplicacao()">
                Multiplicar
            </button>

            <p id="resultadomult"></p>
    </section>

    <section>
        <h1>Calculadora de Divisão</h1>

            <label for="div1">Primeiro número:</label>

            <input type="number" id="div1">

            <br><br>

            <label for="div2">Segundo número:</label>

            <input type="number" id="div2">

            <br><br>

            <button onclick="divisao()">
                Divida
            </button>

            <p id="resultadodiv"></p>
    </section>
</body>
</html>
