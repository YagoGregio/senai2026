<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sistema de Notas</title>
</head>
<body>
    <h1>Sistema de Notas</h1>
    <center>
        <h1>Lançamento de Notas</h1>
        <form action="http://localhost:3000" method="post">

            <input type="number" placeholder="identificação" name="id" required>
            <br><br>

            <input type="text" placeholder="nome" name="id" required>
            <br><br>

            <input type="number" placeholder="insira a primeira nota" name="nota1" required>
            <br><br>

             <input type="number" placeholder="insira a segunda nota" name="nota2" required>
            <br><br>

             <input type="number" placeholder="insira a terceira nota" name="nota3" required>
            <br><br>

            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </form>
    </center>
</body>
</html>
